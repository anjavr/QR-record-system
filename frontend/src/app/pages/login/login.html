<div class="login-page">
  <div class="login-card">
    <h1>Evidencija prisustva</h1>
    <p class="subtitle">Prijavite se institucionalnim nalogom</p>

    @if (checkingSession) {
      <p>Provjera sesije...</p>
    } @else if (isAuthenticated) {
      <p>Provjera naloga u toku...</p>
       @if (debugMessage) {
  <p style="font-size: 10px; word-break: break-all; padding: 1rem;">{{ debugMessage }}</p>
}
    } @else {
      <button class="login-btn" (click)="onLoginClick()">Prijavi se</button>
    }

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }
   
  </div>
</div>
