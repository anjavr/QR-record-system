spring.application.name=evidencija-backend
server.port=8081

# MySQL connection 3307 mapped in docker
spring.datasource.url=jdbc:mysql://localhost:3307/qr_evidencija
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# OAuth2 Resource Server tells spring where is keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/evidencija

qr.token.secret=ovo-je-tajni-kljuc-za-qr-tokene-najmanje-32-karaktera-dugacak

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
jwt.jwks-uri=${JWT_JWKS_URI:http://localhost:8080/realms/evidencija/protocol/openid-connect/certs}

server.error.include-message=always