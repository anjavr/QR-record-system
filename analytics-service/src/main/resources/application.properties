spring.application.name=analytics-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3307/qr_evidencija
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=none

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

jwt.jwks-uri=${JWT_JWKS_URI:http://localhost:8080/realms/evidencija/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8080/realms/evidencija}

server.error.include-message=always

